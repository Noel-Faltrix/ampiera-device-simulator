name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install WebKit and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev build-essential pkg-config file \
            libssl-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev

      # The Tauri build script embeds ../dist, so the frontend has to exist before any cargo step
      # that compiles the shell.
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  bundle:
    name: Bundle (${{ matrix.name }})
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            tauri-args: --target universal-apple-darwin
          - name: Windows
            os: windows-latest
            rust-targets: ""
            tauri-args: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2

      - run: npm ci

      # No signing and no secrets: the installers are unsigned test builds.
      - uses: tauri-apps/tauri-action@v0
        with:
          tauriScript: npm run tauri
          args: ${{ matrix.tauri-args }}

      # The target directory is src-tauri/target while the shell is outside the workspace and
      # target/ once it is a member.
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.name }}
          if-no-files-found: error
          path: |
            target/**/release/bundle/dmg/*.dmg
            target/**/release/bundle/msi/*.msi
            target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/nsis/*.exe

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: installers
          merge-multiple: true

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # The artifacts keep the bundle folder layout, so collect the files explicitly.
          mapfile -t files < <(find installers -type f)
          printf '%s\n' "${files[@]}"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --generate-notes \
            --title "Ampiera Device Simulator $TAG" "${files[@]}"
